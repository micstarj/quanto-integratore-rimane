<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integratori</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--ac:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--tx:#e8eaed;--mut:#9aa0a6;--bd:#2a2f38}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);padding:16px;max-width:560px;margin:auto}
h1{font-size:22px;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:15px;cursor:pointer}
button.sec{background:transparent;color:var(--mut);border:1px solid var(--bd)}
button.sm{padding:6px 10px;font-size:13px}
.name{font-weight:600;font-size:17px}
.big{font-size:30px;font-weight:700;margin:6px 0 2px}
.mut{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0 12px}
.bar>div{height:100%;transition:width .2s}
.hist{margin-top:10px;border-top:1px solid var(--bd);padding-top:8px;font-size:14px}
.hist div{display:flex;justify-content:space-between;padding:3px 0}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
details summary{cursor:pointer;color:var(--mut);font-size:14px;margin-top:10px}
</style>
</head>
<body>
<h1>💊 Integratori</h1>

<div class="card">
  <div class="name" style="margin-bottom:8px">Nuovo integratore</div>
  <div class="row" style="margin-bottom:8px">
    <input id="nName" placeholder="Nome (es. Proteine)">
    <input id="nTot" type="number" inputmode="decimal" placeholder="Grammi nella confezione">
  </div>
  <button onclick="addSupp()" style="width:100%">Aggiungi</button>
</div>

<div id="list"></div>

<script>
const KEY = 'integratori-v1';
let data = load();

function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || []; }
  catch(e){ return []; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){}
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function fmt(n){ return (Math.round(n*10)/10).toLocaleString('it-IT'); }
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function remaining(s){ return s.total - s.logs.reduce((a,l)=>a+l.g,0); }

function addSupp(){
  const name = document.getElementById('nName').value.trim();
  const tot = parseFloat(document.getElementById('nTot').value.replace(',','.'));
  if(!name || !(tot>0)) return alert('Inserisci nome e grammi validi.');
  data.push({id:uid(), name, total:tot, logs:[]});
  document.getElementById('nName').value='';
  document.getElementById('nTot').value='';
  save(); render();
}
function intake(id){
  const el = document.getElementById('d-'+id);
  const g = parseFloat(el.value.replace(',','.'));
  if(!(g>0)) return alert('Inserisci una dose valida in grammi.');
  const s = data.find(x=>x.id===id);
  s.logs.push({g, t:Date.now()});
  save(); render();
}
function undo(id){
  const s = data.find(x=>x.id===id);
  s.logs.pop(); save(); render();
}
function restock(id){
  const v = prompt('Grammi da aggiungere (nuova confezione):');
  const g = parseFloat((v||'').replace(',','.'));
  if(!(g>0)) return;
  data.find(x=>x.id===id).total += g;
  save(); render();
}
function del(id){
  if(!confirm('Eliminare questo integratore e il suo storico?')) return;
  data = data.filter(x=>x.id!==id); save(); render();
}
function reset(id){
  if(!confirm('Azzerare lo storico e ripartire dalla confezione?')) return;
  const s = data.find(x=>x.id===id);
  const v = prompt('Grammi della nuova confezione:', s.total);
  const g = parseFloat((v||'').replace(',','.'));
  if(!(g>0)) return;
  s.total = g; s.logs = []; save(); render();
}

function render(){
  const box = document.getElementById('list');
  if(!data.length){
    box.innerHTML = '<div class="mut" style="text-align:center;padding:20px">Nessun integratore. Aggiungine uno sopra.</div>';
    return;
  }
  box.innerHTML = data.map(s=>{
    const rem = remaining(s);
    const pct = Math.max(0, Math.min(100, rem/s.total*100));
    const color = pct>40 ? 'var(--ok)' : pct>15 ? 'var(--warn)' : 'var(--bad)';
    const last = s.logs.slice(-5).reverse().map(l=>{
      const d = new Date(l.t);
      return `<div><span>${d.toLocaleDateString('it-IT',{day:'2-digit',month:'short'})} ${d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</span><span>−${fmt(l.g)} g</span></div>`;
    }).join('');
    return `<div class="card">
      <div class="name">${esc(s.name)}</div>
      <div class="big" style="color:${rem<0?'var(--bad)':'inherit'}">${fmt(rem)} g</div>
      <div class="mut">rimasti su ${fmt(s.total)} g · ${s.logs.length} assunzioni</div>
      <div class="bar"><div style="width:${pct}%;background:${color}"></div></div>
      <div class="row">
        <input id="d-${s.id}" type="number" inputmode="decimal" placeholder="Dose (g)" onkeydown="if(event.key==='Enter')intake('${s.id}')">
        <button style="flex:0 0 auto" onclick="intake('${s.id}')">Assumi</button>
      </div>
      ${last ? `<div class="hist">${last}</div>` : ''}
      <details><summary>Altro</summary>
        <div class="actions">
          <button class="sec sm" onclick="undo('${s.id}')" ${s.logs.length?'':'disabled'}>↩ Annulla ultima</button>
          <button class="sec sm" onclick="restock('${s.id}')">＋ Aggiungi scorta</button>
          <button class="sec sm" onclick="reset('${s.id}')">Nuova confezione</button>
          <button class="sec sm" onclick="del('${s.id}')">Elimina</button>
        </div>
      </details>
    </div>`;
  }).join('');
}
render();
</script>
</body>
</html>
